<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字母拼讀與動詞測驗</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="lock-screen">
        <div class="lock-box">
            <h2>🔒 請輸入 5 位數密碼</h2>
            <input type="password" id="pin-input" maxlength="5" placeholder="•••••" onkeydown="if(event.key === 'Enter') checkPin()">
            <br>
            <button onclick="checkPin()">解鎖</button>
            <p id="lock-error" style="color: #e74c3c; display: none; font-weight: bold;">❌ 密碼錯誤！</p>
        </div>
    </div>

    <h1 id="main-header">字母拼讀與動詞測驗</h1>
    
    <!-- 🌟 第一層：主大類選單 -->
    <div id="top-level-menu" class="menu-container top-level-layout">
        <button class="top-menu-btn sh-btn" onclick="openSubMenu('submenu-sh')">
            <span class="icon">🏅</span>
            <span class="text">聖心小一英文檢定</span>
        </button>
        <button class="top-menu-btn p21-btn" onclick="openSubMenu('submenu-p21')">
            <span class="icon">🔤</span>
            <span class="text">P21 Phonics</span>
        </button>
        <button class="top-menu-btn tool-btn" onclick="openSubMenu('submenu-tools')">
            <span class="icon">🛠️</span>
            <span class="text">其他小工具</span>
        </button>
    </div>

    <!-- 🌟 第二層：子目錄選單 (改用 loadView) -->
    <div id="submenu-sh" class="submenu-container" style="display: none;">
        <div class="top-bar"><button class="back-btn" onclick="backToTopMenu()">🔙 回大目錄</button></div>
        <div class="menu-section exam-section">
            <div class="menu-title">🏅 聖心小一英文檢定</div>
            <button class="menu-btn" onclick="loadView('sh-g1', 'tab-sh-vocab', 'family')">👨‍👩‍👧‍👦 1. 家人 (Family) 聽力測驗</button>
            <button class="menu-btn" onclick="loadView('sh-g1', 'tab-sh-vocab', 'weather')">🌤️ 2. 天氣 (Weather) 聽力測驗</button>
            <button class="menu-btn" onclick="loadView('sh-g1', 'tab-sh-vocab', 'food')">🍎 3. 蔬果 (Fruits & Veggies) 聽力測驗</button>
            <button class="menu-btn" onclick="loadView('sh-g1', 'tab-sh-number')">🔢 4. 數字 1-100 聽力是非題</button>
            <button class="menu-btn" onclick="loadView('sh-g1', 'tab-sh-vocab', 'az')">🔤 5. A-Z 單字聽力測驗</button>
            <button class="menu-btn" onclick="loadView('sh-g1', 'tab-sh-vocab', 'shapes')">🔺 6. 形狀 (Shapes) 聽力測驗</button>
            <button class="menu-btn" onclick="loadView('sh-g1', 'tab-sh-vocab', 'comprehensive')">🌟 7. 1-6 綜合模擬大考 (隨機抽半)</button>
        </div>
    </div>

    <div id="submenu-p21" class="submenu-container" style="display: none;">
        <div class="top-bar"><button class="back-btn" onclick="backToTopMenu()">🔙 回大目錄</button></div>
        <div class="menu-section phonics-section">
            <div class="menu-title">🔤 p21 phonics</div>
            <button class="menu-btn" onclick="loadView('p21', 'tab-phonics')">📖 母音發音與填空挑戰</button>
            <button class="menu-btn" onclick="loadView('p21', 'tab-spelling')">🧩 單字拼拼樂</button>
            <button class="menu-btn" onclick="loadView('p21', 'tab-verbs')">🏃 動詞練習與 9 題測驗</button>
        </div>
    </div>

    <div id="submenu-tools" class="submenu-container" style="display: none;">
        <div class="top-bar"><button class="back-btn" onclick="backToTopMenu()">🔙 回大目錄</button></div>
        <div class="menu-section tool-section">
            <div class="menu-title">🛠️ 其他工具</div>
            <button class="menu-btn" onclick="loadView('tools', 'tab-custom')">🔍 自訂語音字典</button>
        </div>
    </div>

    <!-- 🌟 第三層：動態視圖載入區 (所有測驗畫面都會塞進這裡) -->
    <div id="app-content" style="display: none;"></div>

    <!-- 引入 JavaScript 檔案 -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/app-sh.js"></script>
    <script src="js/app-p21.js"></script>
</body>
</html>
