<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字母拼讀發音練習 (牛津版)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            color: #333;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 1.8rem; }
        .subtitle { color: #7f8c8d; margin-bottom: 20px; font-size: 0.9rem; }
        
        /* --- 模式切換按鈕 --- */
        .mode-selector {
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .mode-btn {
            font-size: 1.1rem; padding: 8px 18px; cursor: pointer;
            border: 3px solid transparent; border-radius: 50px;
            background-color: #ecf0f1; color: #7f8c8d; font-weight: bold; transition: all 0.3s ease;
        }
        .mode-btn.active {
            background-color: #fff; color: #e67e22; border-color: #e67e22;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.2); transform: scale(1.05);
        }

        /* 基礎按鈕樣式 */
        .vowel-btn, .drill-vowel-btn {
            cursor: pointer; border: none; border-radius: 12px; color: #fff;
            font-weight: bold; transition: transform 0.1s, opacity 0.3s;
        }
        .vowel-btn:active, .drill-vowel-btn:active { transform: scale(0.95); }
        .cooldown { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        /* 顏色定義 */
        .bg-a { background-color: #FF6B6B; }
        .bg-e { background-color: #4ECDC4; }
        .bg-i { background-color: #45B7D1; }
        .bg-o { background-color: #F9CA24; }
        .bg-u { background-color: #9B59B6; }

        /* --- 區塊共用樣式 --- */
        .section-container {
            background-color: #fff; padding: 20px; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 600px; margin: 15px auto;
        }
        .vowel-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .vowel-btn { font-size: 1.8rem; padding: 12px 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        #example-display, #drill-display { font-size: 1.5rem; color: #e74c3c; font-weight: bold; min-height: 40px; margin-top: 10px; }
        .spell-text { color: #2980b9; font-family: monospace; font-size: 1.6rem; letter-spacing: 2px; }

        /* 獨立特訓區 */
        .drill-section { background-color: #fff9e6; border: 3px dashed #F9CA24; }
        .drill-vowel-btn { font-size: 1.2rem; padding: 8px 18px; opacity: 0.4; }
        .drill-vowel-btn.active { opacity: 1; box-shadow: 0 0 10px rgba(0,0,0,0.3); transform: scale(1.1); }
        .play-drill-btn {
            font-size: 1.2rem; padding: 12px 20px; background-color: #2ecc71; color: white;
            border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%;
        }
        .play-drill-btn:active { background-color: #27ae60; transform: scale(0.98); }

        /* --- 限時遊戲區塊樣式 --- */
        .game-section { background-color: #e8f8f5; border: 3px solid #1abc9c; }
        
        .game-stats {
            display: flex; justify-content: space-around; font-size: 1.3rem; 
            font-weight: bold; margin-bottom: 15px; background-color: #fff;
            padding: 10px; border-radius: 10px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        #game-timer { color: #e67e22; }
        #game-score { color: #27ae60; }

        .game-word-display {
            font-size: 3rem; letter-spacing: 6px; font-weight: bold; color: #2c3e50;
            margin: 10px 0 0 0; font-family: monospace;
        }
        .game-zh-display { font-size: 1.2rem; color: #7f8c8d; margin-bottom: 15px; font-weight: bold; }
        .game-options-container { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .game-opt-btn {
            font-size: 1.5rem; padding: 10px 25px; border: 2px solid #bdc3c7; background-color: #fff;
            border-radius: 10px; cursor: pointer; font-weight: bold; color: #34495e; transition: all 0.2s;
        }
        .game-opt-btn:hover:not(:disabled) { border-color: #3498db; color: #3498db; }
        .game-opt-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        .game-hint-btn {
            font-size: 1rem; padding: 8px 15px; background-color: #f39c12; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .game-start-btn {
            font-size: 1.3rem; padding: 15px 30px; background-color: #e74c3c; color: white;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* --- 自訂輸入區 --- */
        input[type="text"] { font-size: 1.1rem; padding: 10px; width: 50%; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        button.speak-btn { font-size: 1.1rem; padding: 10px 15px; background-color: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>字母拼讀發音練習</h1>
    <p class="subtitle">聽音辨字，加強自然發音記憶</p>

    <!-- 模式切換區塊 -->
    <div class="mode-selector">
        <button id="btn-long" class="mode-btn active" onclick="setMode('long')">🌟 長母音</button>
        <button id="btn-short" class="mode-btn" onclick="setMode('short')">⭐ 短母音</button>
        <button id="btn-mixed" class="mode-btn" onclick="setMode('mixed')">🔥 綜合挑戰</button>
    </div>

    <!-- 區塊 1：綜合練習區 -->
    <div class="section-container">
        <h2 id="title-main" style="font-size: 1.2rem;">🎲 區塊 1: 綜合順序 (視覺拆解+慢速)</h2>
        <div class="vowel-container">
            <button class="vowel-btn bg-a" onclick="playVowel('A', this)">A</button>
            <button class="vowel-btn bg-e" onclick="playVowel('E', this)">E</button>
            <button class="vowel-btn bg-i" onclick="playVowel('I', this)">I</button>
            <button class="vowel-btn bg-o" onclick="playVowel('O', this)">O</button>
            <button class="vowel-btn bg-u" onclick="playVowel('U', this)">U</button>
        </div>
        <div id="example-display">請點擊上方字母！</div>
    </div>

    <!-- 區塊 2：獨立特訓區 -->
    <div class="section-container drill-section">
        <h2 id="title-drill" style="font-size: 1.2rem;">🎯 區塊 2: 單一字母特訓 (純單字)</h2>
        <div class="vowel-container" style="gap: 8px;">
            <button id="drill-a" class="drill-vowel-btn bg-a active" onclick="setDrillVowel('A')">A</button>
            <button id="drill-e" class="drill-vowel-btn bg-e" onclick="setDrillVowel('E')">E</button>
            <button id="drill-i" class="drill-vowel-btn bg-i" onclick="setDrillVowel('I')">I</button>
            <button id="drill-o" class="drill-vowel-btn bg-o" onclick="setDrillVowel('O')">O</button>
            <button id="drill-u" class="drill-vowel-btn bg-u" onclick="setDrillVowel('U')">U</button>
        </div>
        <button class="play-drill-btn" onclick="playDrillWord(this)">🔊 下一個單字</button>
        <div id="drill-display">準備練習 A！</div>
    </div>

    <!-- 區塊 3：限時填空遊戲區 -->
    <div class="section-container game-section">
        <h2 id="title-game" style="font-size: 1.2rem;">🎮 區塊 3: 限時挑戰 (長母音)</h2>
        
        <div class="game-stats">
            <span id="game-timer">⏳ 05:00</span>
            <span id="game-score">🏆 答對: 0</span>
        </div>

        <!-- 遊戲開始畫面 -->
        <div id="game-start-screen">
            <p id="game-end-msg" style="font-size: 1.5rem; color: #e74c3c; font-weight: bold; display: none; line-height: 1.5;"></p>
            <button class="game-start-btn" onclick="startGame()" id="start-btn-text">▶️ 開始 5 分鐘測驗</button>
        </div>

        <!-- 遊戲進行畫面 (預設隱藏) -->
        <div id="game-board" style="display: none;">
            <button class="game-hint-btn" onclick="playGameHint()">🔊 再聽一次發音</button>
            <div class="game-word-display" id="game-word">_ _ _ _</div>
            <div class="game-zh-display" id="game-zh"></div>
            <div id="game-feedback" style="font-weight: bold; color: #7f8c8d;">請選擇缺少的母音：</div>
            <div class="game-options-container" id="game-options"></div>
        </div>
    </div>

    <!-- 區塊 4：自訂單字區 -->

        <h2 style="font-size: 1.2rem;">🔍 區塊 4: 自訂發音翻譯</h2>
        <input type="text" id="custom-word" placeholder="Apple" onkeydown="if(event.key === 'Enter') speakCustomWord()">

        <div id="translation-display" style="margin-top: 15px; font-size: 1.2rem; color: #27ae60; font-weight: bold;"></div>
    </div>

            {w: 'pan', b: 'p _ n', a: 'a', zh: '平底鍋'}, {w: 'can', b: 'c _ n', a: 'a', zh: '罐頭'}, {w: 'fan', b: 'f _ n', a: 'a', zh: '風扇'}, {w: 'map', b: 'm _ p', a: 'a', zh: '地圖'}, {w: 'cap', b: 'c _ p', a: 'a', zh: '帽子'}, {w: 'tap', b: 't _ p', a: 'a', zh: '輕敲'}, {w: 'hat', b: 'h _ t', a: 'a', zh: '帽子'}, {w: 'bat', b: 'b _ t', a: 'a', zh: '蝙蝠'}, {w: 'fat', b: 'f _ t', a: 'a', zh: '胖的'},
            {w: 'bed', b: 'b _ d', a: 'e', zh: '床'}, {w: 'red', b: 'r _ d', a: 'e', zh: '紅色'}, {w: 'Ted', b: 'T _ d', a: 'e', zh: '泰德'}, {w: 'pen', b: 'p _ n', a: 'e', zh: '筆'}, {w: 'hen', b: 'h _ n', a: 'e', zh: '母雞'}, {w: 'ten', b: 't _ n', a: 'e', zh: '十'}, {w: 'jet', b: 'j _ t', a: 'e', zh: '噴射機'}, {w: 'pet', b: 'p _ t', a: 'e', zh: '寵物'}, {w: 'wet', b: 'w _ t', a: 'e', zh: '濕的'},
            {w: 'wig', b: 'w _ g', a: 'i', zh: '假髮'}, {w: 'big', b: 'b _ g', a: 'i', zh: '大的'}, {w: 'pig', b: 'p _ g', a: 'i', zh: '豬'}, {w: 'pin', b: 'p _ n', a: 'i', zh: '大頭針'}, {w: 'bin', b: 'b _ n', a: 'i', zh: '垃圾桶'}, {w: 'fin', b: 'f _ n', a: 'i', zh: '魚鰭'}, {w: 'rip', b: 'r _ p', a: 'i', zh: '撕裂'}, {w: 'dip', b: 'd _ p', a: 'i', zh: '沾'}, {w: 'hip', b: 'h _ p', a: 'i', zh: '臀部'},
            {w: 'top', b: 't _ p', a: 'o', zh: '頂部'}, {w: 'cop', b: 'c _ p', a: 'o', zh: '警察'}, {w: 'mop', b: 'm _ p', a: 'o', zh: '拖把'}, {w: 'dot', b: 'd _ t', a: 'o', zh: '點'}, {w: 'hot', b: 'h _ t', a: 'o', zh: '熱的'}, {w: 'pot', b: 'p _ t', a: 'o', zh: '鍋子'}, {w: 'box', b: 'b _ x', a: 'o', zh: '箱子'}, {w: 'fox', b: 'f _ x', a: 'o', zh: '狐狸'}, {w: 'pox', b: 'p _ x', a: 'o', zh: '痘'},
            {w: 'rub', b: 'r _ b', a: 'u', zh: '摩擦'}, {w: 'cub', b: 'c _ b', a: 'u', zh: '幼獸'}, {w: 'tub', b: 't _ b', a: 'u', zh: '浴缸'}, {w: 'hug', b: 'h _ g', a: 'u', zh: '擁抱'}, {w: 'bug', b: 'b _ g', a: 'u', zh: '蟲'}, {w: 'mug', b: 'm _ g', a: 'u', zh: '馬克杯'}, {w: 'run', b: 'r _ n', a: 'u', zh: '跑'}, {w: 'bun', b: 'b _ n', a: 'u', zh: '小圓麵包'}, {w: 'sun', b: 's _ n', a: 'u', zh: '太陽'}
        ];
        const shortGameAnswers = ['a', 'e', 'i', 'o', 'u'];
        
        const mixedGameWords = [...longGameWords, ...shortGameWords];
        const mixedGameAnswers = [...new Set([...longGameAnswers, ...shortGameAnswers])];

        // --- 全域變數 ---
        let currentMode = 'long'; 
        let mainIndex = { 'long': { A: 0, E: 0, I: 0, O: 0, U: 0 }, 'short': { A: 0, E: 0, I: 0, O: 0, U: 0 }, 'mixed': { A: 0, E: 0, I: 0, O: 0, U: 0 } };
        let drillIndex = { 'long': { A: 0, E: 0, I: 0, O: 0, U: 0 }, 'short': { A: 0, E: 0, I: 0, O: 0, U: 0 }, 'mixed': { A: 0, E: 0, I: 0, O: 0, U: 0 } };
        let currentDrillVowel = 'A'; 
        let isCooldown = false; 
        
        // 計時遊戲變數
        let gameScore = 0;
        let gameTimeLeft = 300; // 5 分鐘
        let gameTimerInterval = null;
        let isGameActive = false;
        let currentGameObj = null; 

        const synth = window.speechSynthesis;
        function getFemaleUSVoice() {
            const voices = synth.getVoices();
            return voices.find(v => v.name.includes('Samantha') || v.name.includes('Google US English') || v.name.includes('Zira')) || voices.find(v => v.lang.startsWith('en'));
        }
        function getActiveExamples() { 
            if(currentMode === 'long') return longExamples;
            if(currentMode === 'short') return shortExamples;
            return mixedExamples;
        }
        function speak(text, lang, customRate = 0.8) {
            if (synth.speaking) synth.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang; utterance.rate = customRate; 
            if (lang === 'en-US') { const voice = getFemaleUSVoice(); if (voice) utterance.voice = voice; }
            synth.speak(utterance);
        }

        // 切換模式 (切換時強制結束目前的遊戲，避免錯亂)
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + mode).classList.add('active');

            const modeTexts = { 'long': '長母音', 'short': '短母音', 'mixed': '綜合挑戰' };
            const mText = modeTexts[mode];
            
            document.getElementById('title-main').innerText = `🎲 區塊 1: 發音學習 (${mText})`;
            document.getElementById('title-drill').innerText = `🎯 區塊 2: 單一字母特訓 (${mText})`;
            document.getElementById('title-game').innerText = `🎮 區塊 3: 限時挑戰 (${mText})`;

            document.getElementById('example-display').innerText = '請點擊上方字母！';
            document.getElementById('drill-display').innerText = `準備練習 ${currentDrillVowel}！`;

            forceEndGame(); // 重置遊戲狀態
        }

        // --- 綜合練習邏輯 (視覺拆解 + 慢速 0.4) ---
        function playVowel(vowel, btnElement) {
            if (isCooldown) return; 
            isCooldown = true; btnElement.classList.add('cooldown');
            const display = document.getElementById('example-display');
            const words = getActiveExamples()[vowel];
            const currentWord = words[mainIndex[currentMode][vowel]];

            const chunkVisual = currentWord.c.join(' - ');
            display.innerHTML = `<span class="spell-text">${chunkVisual}</span> <br> ➔ ${currentWord.en} (${currentWord.zh})`;
            speak(currentWord.en, 'en-US', 0.4); 

            mainIndex[currentMode][vowel] = (mainIndex[currentMode][vowel] + 1) % words.length;
            setTimeout(() => { isCooldown = false; btnElement.classList.remove('cooldown'); }, 1500);
        }

        // --- 獨立特訓區邏輯 (純單字 + 正常速 0.8) ---
        function setDrillVowel(vowel) {
            currentDrillVowel = vowel;
            document.querySelectorAll('.drill-vowel-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('drill-' + vowel.toLowerCase()).classList.add('active');
            document.getElementById('drill-display').innerText = `準備練習 ${vowel}！`;
        }
        function playDrillWord(btnElement) {
            if (isCooldown) return; 
            isCooldown = true; btnElement.classList.add('cooldown');
            const display = document.getElementById('drill-display');
            const words = getActiveExamples()[currentDrillVowel];
            const currentWord = words[drillIndex[currentMode][currentDrillVowel]];

            display.innerHTML = `${currentWord.en} (${currentWord.zh})`;
            speak(currentWord.en, 'en-US', 0.8);

            drillIndex[currentMode][currentDrillVowel] = (drillIndex[currentMode][currentDrillVowel] + 1) % words.length;
            setTimeout(() => { isCooldown = false; btnElement.classList.remove('cooldown'); }, 1200);
        }

        // --- 填空遊戲邏輯 ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function forceEndGame() {
            isGameActive = false;
            clearInterval(gameTimerInterval);
            gameTimeLeft = 300;
            document.getElementById('game-timer').innerText = `⏳ 05:00`;
            document.getElementById('game-score').innerText = `🏆 答對: 0`;
            document.getElementById('game-board').style.display = 'none';
            document.getElementById('game-start-screen').style.display = 'block';
            document.getElementById('game-end-msg').style.display = 'none';
            document.getElementById('start-btn-text').innerText = '▶️ 開始 5 分鐘測驗';
        }

        function startGame() {
            gameScore = 0;
            gameTimeLeft = 300;
            isGameActive = true;
            
            document.getElementById('game-score').innerText = `🏆 答對: 0`;
            document.getElementById('game-timer').innerText = `⏳ 05:00`;
            
            document.getElementById('game-start-screen').style.display = 'none';
            document.getElementById('game-board').style.display = 'block';
            
            nextGameQuestion();
            
            if(gameTimerInterval) clearInterval(gameTimerInterval);
            gameTimerInterval = setInterval(() => {
                gameTimeLeft--;
                document.getElementById('game-timer').innerText = `⏳ ${formatTime(gameTimeLeft)}`;
                if (gameTimeLeft <= 0) { endGame(); }
            }, 1000);
        }

        function endGame() {
            isGameActive = false;
            clearInterval(gameTimerInterval);
            document.getElementById('game-board').style.display = 'none';
            document.getElementById('game-start-screen').style.display = 'block';
            document.getElementById('game-end-msg').innerText = `⏰ 時間到！\n恭喜你總共答對了 ${gameScore} 題！`;
            document.getElementById('game-end-msg').style.display = 'block';
            document.getElementById('start-btn-text').innerText = '🔄 再挑戰一次';
        }

        function nextGameQuestion() {
            if(!isGameActive) return;

            let gWords = longGameWords;
            let gAnswers = longGameAnswers;
            if (currentMode === 'short') { gWords = shortGameWords; gAnswers = shortGameAnswers; }
            if (currentMode === 'mixed') { gWords = mixedGameWords; gAnswers = mixedGameAnswers; }

            const randomIdx = Math.floor(Math.random() * gWords.length);
            currentGameObj = gWords[randomIdx];

            let wrongAnswers = gAnswers.filter(v => v !== currentGameObj.a);
            wrongAnswers.sort(() => 0.5 - Math.random());
            let options = [currentGameObj.a, wrongAnswers[0], wrongAnswers[1]];
            options.sort(() => 0.5 - Math.random()); 

            document.getElementById('game-word').innerText = currentGameObj.b;
            document.getElementById('game-zh').innerText = `(${currentGameObj.zh})`;
            document.getElementById('game-feedback').innerText = '請選擇缺少的母音：';
            document.getElementById('game-feedback').style.color = '#7f8c8d';
            
            const optsDiv = document.getElementById('game-options');
            optsDiv.innerHTML = ''; 
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'game-opt-btn'; btn.innerText = opt;
                btn.onclick = function() { checkGameAnswer(opt, this); };
                optsDiv.appendChild(btn);
            });
            
            setTimeout(() => { if(isGameActive) speak(currentGameObj.w, 'en-US', 0.8); }, 500);
        }

        function checkGameAnswer(ans, btn) {
            if(!isGameActive) return;
            const feedbackText = document.getElementById('game-feedback');
            
            if (ans === currentGameObj.a) {
                // 答對了
                btn.style.backgroundColor = '#2ecc71'; btn.style.color = 'white'; btn.style.borderColor = '#2ecc71';
                feedbackText.innerText = '🎉 答對了！'; feedbackText.style.color = '#27ae60';
                
                gameScore++;
                document.getElementById('game-score').innerText = `🏆 答對: ${gameScore}`;
                document.getElementById('game-word').innerText = currentGameObj.w;
                
                speak(currentGameObj.w, 'en-US', 0.8); 
                
                // 鎖定所有選項
                document.querySelectorAll('.game-opt-btn').forEach(b => b.disabled = true);
                
                // 【重點更新】停頓 1.5 秒後自動進入下一題！
                setTimeout(() => { if(isGameActive) nextGameQuestion(); }, 1500);
            } else {
                // 答錯了
                btn.style.backgroundColor = '#e74c3c'; btn.style.color = 'white'; btn.style.borderColor = '#e74c3c';
                btn.disabled = true; 
                feedbackText.innerText = '❌ 答錯囉，再試一次！'; feedbackText.style.color = '#e74c3c';
                speak(currentGameObj.w, 'en-US', 0.8); 
            }
        }
        
        function playGameHint() { if(currentGameObj && isGameActive) speak(currentGameObj.w, 'en-US', 0.8); }

        // --- 自訂單字邏輯 ---
        async function speakCustomWord() {
            const inputEl = document.getElementById('custom-word');
            const transDisplay = document.getElementById('translation-display');
            const word = inputEl.value.trim();
            if (!word) { alert("請先輸入英文單字！"); return; }
            transDisplay.innerText = "正在翻譯中...";
            try {
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-TW`;
                const response = await fetch(apiUrl);
                const data = await response.json();
                transDisplay.innerText = `中文: ${data.responseData.translatedText}`;
                speak(word, 'en-US');
            } catch (error) {
                transDisplay.innerText = "翻譯失敗，請檢查網路。";
                speak(word, 'en-US');
            }
        }
    </script>
