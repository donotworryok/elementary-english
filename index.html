<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字母拼讀與動詞測驗</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            color: #333;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 1.8rem; }
        
        /* --- 頂部導覽分頁 (Tabs) --- */
        .nav-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            background-color: #fff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .tab-btn {
            font-size: 1.2rem; padding: 12px 20px; border: none; border-radius: 12px;
            background-color: transparent; color: #7f8c8d; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #3498db; color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); transform: scale(1.05);
        }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 模式切換按鈕 --- */
        .mode-selector {
            margin: 10px auto 20px auto;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
        }
        .mode-btn {
            font-size: 1.1rem; padding: 8px 18px; cursor: pointer;
            border: 3px solid transparent; border-radius: 50px;
            background-color: #ecf0f1; color: #7f8c8d; font-weight: bold; transition: all 0.3s ease;
        }
        .mode-btn.active {
            background-color: #fff; color: #e67e22; border-color: #e67e22;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.2); transform: scale(1.05);
        }

        /* 基礎按鈕樣式 */
        .vowel-btn, .drill-vowel-btn {
            cursor: pointer; border: none; border-radius: 12px; color: #fff;
            font-weight: bold; transition: transform 0.1s, opacity 0.3s;
        }
        .vowel-btn:active, .drill-vowel-btn:active { transform: scale(0.95); }
        .cooldown { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        /* 動詞按鈕樣式 */
        .verb-btn {
            font-size: 1.2rem; padding: 10px 15px; background-color: #34495e; color: white;
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: transform 0.1s, background-color 0.3s; box-shadow: 0 3px 5px rgba(0,0,0,0.15);
        }
        .verb-btn:active { transform: scale(0.95); }
        .verb-btn:hover { background-color: #2c3e50; }

        /* 顏色定義 */
        .bg-a { background-color: #FF6B6B; }
        .bg-e { background-color: #4ECDC4; }
        .bg-i { background-color: #45B7D1; }
        .bg-o { background-color: #F9CA24; }
        .bg-u { background-color: #9B59B6; }

        /* --- 區塊共用樣式 --- */
        .section-container {
            background-color: #fff; padding: 20px; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 600px; margin: 15px auto;
        }
        .vowel-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .vowel-btn { font-size: 1.8rem; padding: 12px 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        #example-display, #drill-display { font-size: 1.5rem; color: #e74c3c; font-weight: bold; min-height: 40px; margin-top: 10px; }
        .spell-text { color: #2980b9; font-family: monospace; font-size: 1.6rem; letter-spacing: 2px; }

        /* 獨立特訓區 */
        .drill-section { background-color: #fff9e6; border: 3px dashed #F9CA24; }
        .drill-vowel-btn { font-size: 1.2rem; padding: 8px 18px; opacity: 0.4; }
        .drill-vowel-btn.active { opacity: 1; box-shadow: 0 0 10px rgba(0,0,0,0.3); transform: scale(1.1); }
        .play-drill-btn {
            font-size: 1.2rem; padding: 12px 20px; background-color: #2ecc71; color: white;
            border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%;
        }
        .play-drill-btn:active { background-color: #27ae60; transform: scale(0.98); }

        /* --- 遊戲區塊樣式 --- */
        .game-section { background-color: #e8f8f5; border: 3px solid #1abc9c; }
        .game-stats {
            display: flex; justify-content: space-around; font-size: 1.3rem; 
            font-weight: bold; margin-bottom: 15px; background-color: #fff;
            padding: 10px; border-radius: 10px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .game-word-display {
            font-size: 2.4rem; letter-spacing: 2px; font-weight: bold; color: #2c3e50;
            margin: 15px 0 5px 0; font-family: monospace;
        }
        .game-zh-display { font-size: 1.2rem; color: #7f8c8d; margin-bottom: 15px; font-weight: bold; }
        .game-options-container { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .game-opt-btn {
            font-size: 1.5rem; padding: 10px 25px; border: 2px solid #bdc3c7; background-color: #fff;
            border-radius: 10px; cursor: pointer; font-weight: bold; color: #34495e; transition: all 0.2s;
        }
        .game-opt-btn:hover:not(:disabled) { border-color: #3498db; color: #3498db; }
        .game-opt-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        .game-hint-btn {
            font-size: 1rem; padding: 8px 15px; background-color: #f39c12; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .game-start-btn {
            font-size: 1.3rem; padding: 15px 30px; background-color: #e74c3c; color: white;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* --- 動詞區塊樣式 --- */
        .verb-section { background-color: #fce4ec; border: 3px solid #f06292; }
        .verb-game-section { background-color: #f5eef8; border: 3px solid #9b59b6; }

        /* --- Reset 按鈕樣式 --- */
        .reset-btn {
            background-color: #e74c3c; color: white; border: none; padding: 6px 15px;
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
            margin-bottom: 15px; transition: background-color 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .reset-btn:hover { background-color: #c0392b; }

        /* --- 自訂輸入區 --- */
        input[type="text"] { font-size: 1.1rem; padding: 10px; width: 50%; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        button.speak-btn { font-size: 1.1rem; padding: 10px 15px; background-color: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>字母拼讀與動詞測驗</h1>
    
    <!-- 頂部導覽分頁按鈕 -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-phonics', this)">📖 1. AEIOU 發音</button>
        <button class="tab-btn" onclick="switchTab('tab-verbs', this)">🏃 2. 動詞練習與 9 題測驗</button>
        <button class="tab-btn" onclick="switchTab('tab-custom', this)">🔍 3. 自訂字典</button>
    </div>

    <!-- =========================
         第一章：AEIOU 發音區塊 
         ========================= -->
    <div id="tab-phonics" class="tab-content" style="display: block;">
        <button class="reset-btn" onclick="resetCurrentTab('phonics')">🔄 Reset 本頁</button>
        
        <div class="mode-selector">
            <button id="btn-long" class="mode-btn active" onclick="setMode('long')">🌟 長母音</button>
            <button id="btn-short" class="mode-btn" onclick="setMode('short')">⭐ 短母音</button>
            <button id="btn-mixed" class="mode-btn" onclick="setMode('mixed')">🔥 綜合挑戰</button>
        </div>

        <div class="section-container">
            <h2 id="title-main" style="font-size: 1.2rem;">🎲 綜合順序 (視覺拆解+慢速)</h2>
            <div class="vowel-container">
                <button class="vowel-btn bg-a" onclick="playVowel('A', this)">A</button>
                <button class="vowel-btn bg-e" onclick="playVowel('E', this)">E</button>
                <button class="vowel-btn bg-i" onclick="playVowel('I', this)">I</button>
                <button class="vowel-btn bg-o" onclick="playVowel('O', this)">O</button>
                <button class="vowel-btn bg-u" onclick="playVowel('U', this)">U</button>
            </div>
            <div id="example-display">請點擊上方字母！</div>
        </div>

        <div class="section-container drill-section">
            <h2 id="title-drill" style="font-size: 1.2rem;">🎯 單一字母特訓 (純單字)</h2>
            <div class="vowel-container" style="gap: 8px;">
                <button id="drill-a" class="drill-vowel-btn bg-a active" onclick="setDrillVowel('A')">A</button>
                <button id="drill-e" class="drill-vowel-btn bg-e" onclick="setDrillVowel('E')">E</button>
                <button id="drill-i" class="drill-vowel-btn bg-i" onclick="setDrillVowel('I')">I</button>
                <button id="drill-o" class="drill-vowel-btn bg-o" onclick="setDrillVowel('O')">O</button>
                <button id="drill-u" class="drill-vowel-btn bg-u" onclick="setDrillVowel('U')">U</button>
            </div>
            <button class="play-drill-btn" onclick="playDrillWord(this)">🔊 下一個單字</button>
            <div id="drill-display">準備練習 A！</div>
        </div>

        <div class="section-container game-section">
            <h2 id="title-game" style="font-size: 1.2rem;">🎮 限時挑戰 (長母音)</h2>
            <div class="game-stats">
                <span id="game-timer" style="color: #e67e22;">⏳ 05:00</span>
                <span id="game-score" style="color: #27ae60;">🏆 答對: 0</span>
            </div>
            <div id="game-start-screen">
                <p id="game-end-msg" style="font-size: 1.5rem; color: #e74c3c; font-weight: bold; display: none; line-height: 1.5;"></p>
                <button class="game-start-btn" onclick="startGame()" id="start-btn-text">▶️ 開始 5 分鐘測驗</button>
            </div>
            <div id="game-board" style="display: none;">
                <button class="game-hint-btn" onclick="playGameHint()">🔊 再聽一次發音</button>
                <div class="game-word-display" id="game-word">c [ ? ] k e</div>
                <div class="game-zh-display" id="game-zh"></div>
                <div id="game-feedback" style="font-weight: bold; color: #7f8c8d;">請選擇缺少的母音：</div>
                <div class="game-options-container" id="game-options"></div>
            </div>
        </div>
    </div>

    <!-- =========================
         第二章：動詞練習與 9 題測驗區塊 
         ========================= -->
    <div id="tab-verbs" class="tab-content">
        <button class="reset-btn" onclick="resetCurrentTab('verbs')">🔄 Reset 本頁</button>
        
        <!-- 上方：原本的動詞短句練習 -->
        <div class="section-container verb-section">
            <h2 style="font-size: 1.2rem;">🏃 動詞短句練習 (Verbs)</h2>
            <p style="color:#7f8c8d; font-size: 0.9rem; margin-bottom: 5px;">點擊按鈕，練習朗讀完整句子</p>
            <div class="vowel-container" style="gap: 12px; margin-top: 15px;">
                <button class="verb-btn" onclick="playVerb(0, this)">read</button>
                <button class="verb-btn" onclick="playVerb(1, this)">write</button>
                <button class="verb-btn" onclick="playVerb(2, this)">look</button>
                <button class="verb-btn" onclick="playVerb(3, this)">ride</button>
                <button class="verb-btn" onclick="playVerb(4, this)">open</button>
                <button class="verb-btn" onclick="playVerb(5, this)">color</button>
                <button class="verb-btn" onclick="playVerb(6, this)">listen</button>
                <button class="verb-btn" onclick="playVerb(7, this)">eat</button>
                <button class="verb-btn" onclick="playVerb(8, this)">draw</button>
            </div>
            <div id="verb-display" style="font-size: 1.6rem; color: #d81b60; font-weight: bold; margin-top: 15px; min-height: 40px;">請點擊上方動詞！</div>
            <div id="verb-zh-display" style="font-size: 1.2rem; color: #7f8c8d; font-weight: bold; margin-top: 5px;"></div>
        </div>

        <!-- 下方：9 題動詞填空挑戰 -->
        <div class="section-container verb-game-section">
            <h2 style="font-size: 1.2rem;">🎮 動詞短句 9 題填空挑戰</h2>
            <p style="color:#7f8c8d; font-size: 0.9rem; margin-bottom: 5px;">看句子，選出正確的動詞填空</p>
            
            <div class="game-stats">
                <span id="verb-progress" style="color: #8e44ad;">📊 第 1 題 / 共 9 題</span>
                <span id="verb-score" style="color: #27ae60;">🏆 得分: 0 / 9</span>
            </div>
            
            <div id="verb-start-screen">
                <p id="verb-end-msg" style="font-size: 1.5rem; color: #e74c3c; font-weight: bold; display: none; line-height: 1.5;"></p>
                <button class="game-start-btn" style="background-color: #8e44ad; box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3);" onclick="startVerbQuiz()">▶️ 開始 9 題動詞測驗</button>
            </div>
            
            <div id="verb-board" style="display: none;">
                <div class="game-word-display" id="verb-sentence" style="font-size: 1.8rem; letter-spacing: 1px; margin-top: 10px;">I [ ? ] a book.</div>
                <div class="game-zh-display" id="verb-zh" style="margin-top: 10px;">(我讀一本書)</div>
                
                <div id="verb-feedback" style="font-weight: bold; color: #7f8c8d; margin-top: 10px;">請選擇正確的動詞：</div>
                <div class="game-options-container" id="verb-options"></div>
            </div>
        </div>
    </div>

    <!-- =========================
         第三章：自訂字典區塊 
         ========================= -->
    <div id="tab-custom" class="tab-content">
        <button class="reset-btn" onclick="resetCurrentTab('custom')">🔄 Reset 本頁</button>
        <div class="section-container">
            <h2 style="font-size: 1.2rem;">🔍 自訂發音翻譯</h2>
            <input type="text" id="custom-word" placeholder="輸入單字，例如 Apple" onkeydown="if(event.key === 'Enter') speakCustomWord()">
            <button class="speak-btn" onclick="speakCustomWord()">唸出</button>
            <div id="translation-display" style="margin-top: 15px; font-size: 1.2rem; color: #27ae60; font-weight: bold;"></div>
        </div>
    </div>

    <script>
        // --- 頁籤切換邏輯 ---
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => { tab.style.display = 'none'; });
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('active'); });
            document.getElementById(tabId).style.display = 'block';
            btnElement.classList.add('active');

            if (tabId !== 'tab-phonics' && isGameActive) forceEndGame();
        }

        // --- Reset 當前頁面函數 ---
        function resetCurrentTab(tabName) {
            if (tabName === 'phonics') {
                forceEndGame();
                document.getElementById('example-display').innerText = '請點擊上方字母！';
                document.getElementById('drill-display').innerText = '準備練習 A！';
                setMode('long');
            } else if (tabName === 'verbs') {
                document.getElementById('verb-display').innerText = '請點擊上方動詞！';
                document.getElementById('verb-zh-display').innerText = '';
            } else if (tabName === 'custom') {
                document.getElementById('custom-word').value = '';
                document.getElementById('translation-display').innerText = '';
            }
        }

        // --- 發音與 iOS 修復 ---
        const synth = window.speechSynthesis;
        function getFemaleUSVoice() {
            const voices = synth.getVoices();
            return voices.find(v => v.name.includes('Samantha') || v.name.includes('Google US English') || v.name.includes('Zira')) || voices.find(v => v.lang.startsWith('en'));
        }
        function speak(text, lang, customRate = 0.8) {
            if (synth.speaking) synth.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang; 
            utterance.rate = Math.max(0.5, customRate);
            if (lang === 'en-US') { 
                const voice = getFemaleUSVoice(); 
                if (voice) utterance.voice = voice; 
            }
            synth.speak(utterance);
        }

        // --- AEIOU 字典區 ---
        const longExamples = {
            'A': [ {en: 'maid', zh: '女僕', c: ['m','ai','d']}, {en: 'paint', zh: '畫畫', c: ['p','ai','n','t']}, {en: 'rain', zh: '雨', c: ['r','ai','n']}, {en: 'bay', zh: '海灣', c: ['b','ay']}, {en: 'hay', zh: '乾草', c: ['h','ay']}, {en: 'pay', zh: '支付', c: ['p','ay']}, {en: 'cake', zh: '蛋糕', c: ['c','a','k','e']}, {en: 'gate', zh: '大門', c: ['g','a','t','e']}, {en: 'tape', zh: '膠帶', c: ['t','a','p','e']} ],
            'E': [ {en: 'bean', zh: '豆子', c: ['b','ea','n']}, {en: 'leaf', zh: '葉子', c: ['l','ea','f']}, {en: 'seat', zh: '座位', c: ['s','ea','t']}, {en: 'jeep', zh: '吉普車', c: ['j','ee','p']}, {en: 'bee', zh: '蜜蜂', c: ['b','ee']}, {en: 'weed', zh: '雜草', c: ['w','ee','d']}, {en: 'alley', zh: '小巷', c: ['a','ll','ey']}, {en: 'hockey', zh: '曲棍球', c: ['h','o','ck','ey']}, {en: 'key', zh: '鑰匙', c: ['k','ey']} ],
            'I': [ {en: 'die', zh: '凋零', c: ['d','ie']}, {en: 'pie', zh: '派', c: ['p','ie']}, {en: 'tie', zh: '領帶', c: ['t','ie']}, {en: 'high', zh: '高的', c: ['h','igh']}, {en: 'knight', zh: '騎士', c: ['kn','igh','t']}, {en: 'light', zh: '燈光', c: ['l','igh','t']}, {en: 'vine', zh: '藤蔓', c: ['v','i','n','e']}, {en: 'ice', zh: '冰塊', c: ['i','c','e']}, {en: 'time', zh: '時間', c: ['t','i','m','e']} ],
            'O': [ {en: 'soap', zh: '肥皂', c: ['s','oa','p']}, {en: 'boat', zh: '小船', c: ['b','oa','t']}, {en: 'road', zh: '道路', c: ['r','oa','d']}, {en: 'toe', zh: '腳趾', c: ['t','oe']}, {en: 'doe', zh: '母鹿', c: ['d','oe']}, {en: 'hoe', zh: '鋤頭', c: ['h','oe']}, {en: 'bone', zh: '骨頭', c: ['b','o','n','e']}, {en: 'mole', zh: '鼴鼠', c: ['m','o','l','e']}, {en: 'rope', zh: '繩索', c: ['r','o','p','e']} ],
            'U': [ {en: 'pew', zh: '長椅', c: ['p','ew']}, {en: 'new', zh: '新的', c: ['n','ew']}, {en: 'stew', zh: '燉菜', c: ['s','t','ew']}, {en: 'hue', zh: '色彩', c: ['h','ue']}, {en: 'cue', zh: '提示', c: ['c','ue']}, {en: 'rescue', zh: '救援', c: ['r','e','s','c','ue']}, {en: 'huge', zh: '巨大的', c: ['h','u','g','e']}, {en: 'cute', zh: '可愛的', c: ['c','u','t','e']}, {en: 'tube', zh: '管子', c: ['t','u','b','e']} ]
        };
        const shortExamples = {

                verbScoreCount++;
                document.getElementById('verb-score').innerText = `🏆 得分: ${verbScoreCount} / 9`;
                
                document.getElementById('verb-sentence').innerText = currentVerbObj.sentence;

                document.querySelectorAll('#verb-options .game-opt-btn').forEach(b => b.disabled = true);

                verbCurrentIdx++;
                setTimeout(() => {
                    loadVerbQuestion();
                }, 1500);

            } else {
                btn.style.backgroundColor = '#e74c3c';
                btn.style.color = 'white';
                btn.style.borderColor = '#e74c3c';
                btn.disabled = true;

                feedbackText.innerText = '❌ 答錯囉，再試一次！';
                feedbackText.style.color = '#e74c3c';
            }
        }

        // --- 翻譯邏輯 ---
        async function speakCustomWord() {
            const transDisplay = document.getElementById('translation-display');
            const word = document.getElementById('custom-word').value.trim();
            if (!word) { alert("請先輸入英文單字！"); return; }
            transDisplay.innerText = "正在翻譯中...";
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-TW`);
                const data = await response.json();
                transDisplay.innerText = `中文: ${data.responseData.translatedText}`; speak(word, 'en-US');
            } catch (error) {
                transDisplay.innerText = "翻譯失敗，請檢查網路。"; speak(word, 'en-US');
            }
        }
    </script>
</body>
